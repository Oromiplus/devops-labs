name: Day 42 CI

on:
  push:

jobs:

  info:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Date
        run: date

      - name: Show User
        run: whoami

      - name: Show Directory
        run: pwd

  system:
    needs: info
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run System Information Script
        run: bash scripts/system_info.sh

      - name: Memory
        run: free -h

      - name: Uptime
        run: uptime

  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r day49-multi-container/backend/requirements.txt

      - name: Run Backend Tests
        working-directory: day49-multi-container/backend
        run: python -m unittest -v test_app.py
